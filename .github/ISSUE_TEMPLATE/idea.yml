name: Idea para probar
description: Algo para que el loop de autoresearch pruebe
title: "[idea] "
labels: ["idea"]
body:
  - type: textarea
    id: que
    attributes:
      label: Qué probar
      description: Qué cambiar en el modelo o en el proceso
    validations:
      required: true
  - type: textarea
    id: porque
    attributes:
      label: Por qué debería mejorar
      description: Hipótesis, qué esperás ver y en qué folds
  - type: input
    id: fuente
    attributes:
      label: Fuente
      placeholder: Paper, clase, intuición…
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options: ["alta", "media", "baja"]
      default: 1
